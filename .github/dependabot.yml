version: 2

updates:
  # App + backend dependencies. Grouped so a solo maintainer gets one or two
  # PRs a week instead of a dozen; security fixes still arrive immediately as
  # their own PRs via Dependabot security updates (a separate feature).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major bumps here are never a drive-by merge. `@convex-dev/agent` 0.6
      # requires AI SDK v6 specifically (see README.md), and Expo majors are an
      # SDK migration. Bump these deliberately, not from a bot PR.
      - dependency-name: ai
        update-types: [version-update:semver-major]
      - dependency-name: expo
        update-types: [version-update:semver-major]
      # Expo pins these to exact versions per SDK (`expo/bundledNativeModules.json`),
      # and its type shim for react-native-web is written against that pin. A
      # bump past it breaks typecheck (#147: react-native 0.87 vs SDK 57's 0.86)
      # or native builds. `npx expo install --fix` moves them, together, at SDK
      # upgrade time.
      - dependency-name: react-native
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-web
      - dependency-name: react-native-svg
      - dependency-name: react-native-gesture-handler

  # Keep CI actions current; a stale action is a supply-chain risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
